server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large CSV uploads (no limit)
    client_max_body_size 0;

    # SPA routing — mọi route đều trả về index.html (không cache để luôn nhận update mới)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Docker DNS resolver (127.0.0.11) giúp Nginx khởi động được ngay cả khi backend chưa sẵn sàng.
    # Sử dụng biến cho proxy_pass để ép Nginx resolve tại runtime thay vì lúc startup.
    resolver 127.0.0.11 valid=30s;
    set $backend_upstream http://backend:8000;
    set $minio_upstream http://minio:9000;

    # Proxy API requests tới FastAPI backend
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── MinIO Upload Proxy ──────────────────────────────────────────────────────
    # Browser uploads CSV via presigned URL through this proxy route.
    # URL pattern: /minio-upload/lake/csv-staging/<uuid>/file.csv?X-Amz-...
    # Nginx strips /minio-upload prefix and forwards remaining path to minio:9000
    # Host header is set to minio:9000 → matches what was signed → signature validates.
    location /minio-upload/ {
        rewrite ^/minio-upload/(.*)$ /$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
        client_max_body_size 0;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
