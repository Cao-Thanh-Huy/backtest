services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 15 - Metadata store & MLflow backend
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: quant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quant_net

  # ---------------------------------------------------------------------------
  # MinIO - S3-compatible Data Lake (Parquet files + ML model artifacts)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: quant_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quant_net

  # MinIO bucket initializer (runs once then exits)
  minio_init:
    image: minio/mc:latest
    container_name: quant_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET_RAW};
      mc mb --ignore-existing local/${MINIO_BUCKET_PROCESSED};
      mc mb --ignore-existing local/${MINIO_BUCKET_MODELS};
      echo 'MinIO buckets initialized';
      "
    environment:
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW}
      MINIO_BUCKET_PROCESSED: ${MINIO_BUCKET_PROCESSED}
      MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - quant_net

  # ---------------------------------------------------------------------------
  # Valkey - Redis OSS-compatible broker/cache/streams
  # ---------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:7-alpine
    container_name: quant_valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quant_net

  # ---------------------------------------------------------------------------
  # MLflow - Experiment tracking (PostgreSQL backend + MinIO artifacts)
  # ---------------------------------------------------------------------------
  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile
    container_name: quant_mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      mlflow server
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI}
      --default-artifact-root ${MLFLOW_ARTIFACT_ROOT}
      --host 0.0.0.0
      --port 5000
    environment:
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - quant_net

  # ---------------------------------------------------------------------------
  # FastAPI Backend - REST API + WebSocket server
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - quant_net

  # ---------------------------------------------------------------------------
  # Celery Worker - Background task executor
  # ---------------------------------------------------------------------------
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_celery_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - ./backend:/app
    mem_limit: ${CELERY_FEATURES_MEM_LIMIT}
    mem_reservation: ${CELERY_FEATURES_MEM_RESERVATION}
    command:
      - watchfiles
      - --filter
      - python
      - celery -A workers.celery_app worker --loglevel=info --concurrency=${CELERY_FEATURES_CONCURRENCY} --max-tasks-per-child=${CELERY_FEATURES_MAX_TASKS_PER_CHILD} -Q features
      - /app
    networks:
      - quant_net

  celery_aux_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_celery_aux_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - ./backend:/app
    command:
      - watchfiles
      - --filter
      - python
      - celery -A workers.celery_app worker --loglevel=info --concurrency=${CELERY_AUX_CONCURRENCY} --max-tasks-per-child=${CELERY_AUX_MAX_TASKS_PER_CHILD} -Q training,backtest,default
      - /app
    networks:
      - quant_net

  # ---------------------------------------------------------------------------
  # Flower - Celery monitoring UI
  # ---------------------------------------------------------------------------
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quant_flower
    restart: unless-stopped
    depends_on:
      - valkey
      - celery_worker
      - celery_aux_worker
    env_file: .env
    command: >
      celery -A workers.celery_app flower
      --port=5555
      --broker=${CELERY_BROKER_URL}
    ports:
      - "5555:5555"
    networks:
      - quant_net

  # ---------------------------------------------------------------------------
  # Next.js Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_MLFLOW_URL: ${NEXT_PUBLIC_MLFLOW_URL}
    container_name: quant_frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file: .env
    ports:
      - "3000:3000"
    networks:
      - quant_net

  # ---------------------------------------------------------------------------
  # Nginx - Reverse proxy (optional, good for production)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: quant_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - quant_net

volumes:
  postgres_data:
  minio_data:
  valkey_data:

networks:
  quant_net:
    driver: bridge
